name: Build iOS app and upload to TestFlight
# Runs on GitHub's Mac servers, so no Mac is needed.
# Needs repo secrets: APPLE_TEAM_ID, APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8
# Optional: ADMOB_APP_ID_IOS (defaults to Halo Pop's AdMob iOS app ID)
on:
  workflow_dispatch:
    inputs:
      live_ads:
        description: 'Use real AdMob ads (only for the App Store release build)'
        type: boolean
        default: false
jobs:
  ios:
    runs-on: macos-15
    env:
      ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
      ADS_LIVE: ${{ inputs.live_ads && '1' || '0' }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check secrets
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done

      - name: Install
        run: npm install

      - name: Build web and create iOS project
        run: |
          node scripts/build.mjs
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#cfeaff' --splashBackgroundColor '#cfeaff'
          npx cap sync ios
          node scripts/patch-native.mjs

      - name: Save App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_KEY_P8 }}" > ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Archive (unsigned; signing happens at upload)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then SRC=(-workspace ios/App/App.xcworkspace); else SRC=(-project ios/App/App.xcodeproj); fi
          set -o pipefail
          xcodebuild archive \
            "${SRC[@]}" \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HaloPop.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=$(node -p "require('./package.json').version") \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|\*\* ARCHIVE" || {
              grep -E "error:|fatal" "$RUNNER_TEMP/archive.log" | sort -u | head -15 | while read -r l; do echo "::error::$l"; done
              exit 1; }

      - name: Sign with Apple cloud signing and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HaloPop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" || {
              grep -iE "error|failed|not |no " "$RUNNER_TEMP/export.log" | grep -v "^\s*$" | sort -u | head -15 | while read -r l; do echo "::error::$l"; done
              exit 1; }

      - name: Remove API key
        if: always()
        run: rm -rf ~/private_keys
