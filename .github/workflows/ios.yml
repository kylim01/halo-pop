name: Build iOS app and upload to TestFlight
# Runs on GitHub's Mac servers, so no Mac is needed.
# Needs repo secrets: APPLE_TEAM_ID, APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8
# Optional: ADMOB_APP_ID_IOS (defaults to Google's test app ID)
on:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-15
    env:
      ADMOB_APP_ID_IOS: ${{ secrets.ADMOB_APP_ID_IOS }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check secrets
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done

      - name: Install
        run: npm install

      - name: Build web and create iOS project
        run: |
          node scripts/build.mjs
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#cfeaff' --splashBackgroundColor '#cfeaff'
          npx cap sync ios
          node scripts/patch-native.mjs

      - name: Save App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPSTORE_KEY_P8 }}" > ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Archive (Xcode signs automatically through the API key)
        run: |
          if [ -d ios/App/App.xcworkspace ]; then SRC=(-workspace ios/App/App.xcworkspace); else SRC=(-project ios/App/App.xcodeproj); fi
          xcodebuild archive \
            "${SRC[@]}" \
            -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HaloPop.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=$(node -p "require('./package.json').version")

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HaloPop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf ~/private_keys
